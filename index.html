<style>
:root{--bg:#0c0c1a;--surface:#151528;--card:#1c1c35;--border:#2a2a4a;--text:#e8e6f0;--dim:#8888aa;--ko:#4ecdc4;--ko2:#0047AB;--red:#C8102E;--gold:#ffd700;--cn:#ffa94d;--yang:#ffd700;--yin:#9c88ff;--foot:#ff9800;--nofoot:#66bb6a}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
.header{padding:10px 14px 6px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.logo{font-size:1rem;font-weight:900;background:linear-gradient(135deg,var(--red),var(--ko));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sw,.lt{display:flex;background:var(--surface);border-radius:18px;border:1px solid var(--border);overflow:hidden}
.ub,.lb{padding:4px 10px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer}
.ub.a{background:rgba(255,215,0,.1);color:var(--gold)}.lt{margin-left:auto}
.hn{display:flex;align-items:center;gap:4px;margin:0 auto}
.nb{width:28px;height:28px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.nb:disabled{opacity:.3}
.nc{font-size:.72rem;color:var(--dim);min-width:40px;text-align:center;background:transparent;border:1px solid transparent;border-radius:6px;font-family:inherit;padding:2px 4px;cursor:pointer}.nc:focus{border-color:rgba(255,215,0,.4);color:#ffd700;outline:none}
.lb.a-ko{background:rgba(78,205,196,.12);color:var(--ko)}.lb.a-zhuyin{background:rgba(255,215,0,.1);color:var(--gold)}
.badge{padding:2px 7px;border-radius:9px;font-size:.58rem}.pb{background:rgba(80,200,120,.1);border:1px solid rgba(80,200,120,.3);color:#50c878}
.dt{display:flex;gap:3px;padding:5px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.03)}.dt::-webkit-scrollbar{display:none}
.tab{padding:3px 9px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--dim);font-family:inherit;font-size:.62rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}.tab.a{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08)}
.mc{margin:10px;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.mc.m-ko{border-color:rgba(78,205,196,.3)}.mc.m-zhuyin{border-color:rgba(255,215,0,.3)}
.ca{padding:14px 18px 6px;text-align:center}.cs{font-size:1.5rem;font-weight:900;color:var(--cn)}.cd{font-size:.72rem;color:var(--dim);margin-top:3px}
.ba{padding:5px 14px 14px;min-height:70px}.br{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:5px 0;animation:fu .3s ease}

.bk-r{font-size:.55rem;opacity:.45;font-weight:400}
.bk-ko{background:rgba(78,205,196,.1);border:1.5px solid rgba(78,205,196,.3);color:#a8ece8}
.bk-foot{position:absolute;bottom:-2px;right:-2px;font-size:.5rem}
.bk-jc{background:rgba(126,234,224,.08);border:1.5px dashed rgba(126,234,224,.35);color:#7eeae0;font-size:.85rem}
.bk-gn{font-size:.5rem;opacity:.55;font-weight:400;max-width:120px;text-align:center;line-height:1.2;margin-top:1px}
.bk-base{font-size:.48rem;opacity:.35;font-weight:400}
.formula-bar{text-align:center;padding:2px 14px 8px;font-size:.68rem;color:rgba(255,215,0,.55);font-weight:700;letter-spacing:.5px}
.r-主角{border-left:3px solid #ff6b6b}.r-動作{border-left:3px solid #4ecdc4}.r-對象{border-left:3px solid #ffd93d}.r-修飾{border-left:3px solid #a78bfa}.r-連接{border-left:3px solid #888}.r-場景{border-left:3px solid #66bb6a}.r-目標{border-left:3px solid #ff9800}.r-時間{border-left:3px solid #42a5f5}.r-語氣{border-left:3px solid #ef5350}
.sf{border:1px solid var(--border);background:var(--surface);color:var(--dim);font-family:inherit;font-size:.75rem;padding:4px 12px;border-radius:9px;cursor:pointer}
.cb{margin:0 14px 10px;padding:10px 14px;border-radius:9px;background:var(--surface);border:1px solid var(--border);font-size:.82rem;line-height:1.7;color:var(--dim)}.cl{font-weight:700;margin-right:3px}
.lg{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 7px;justify-content:center}.li{display:flex;align-items:center;gap:2px;font-size:.48rem;color:var(--dim)}.ld{width:4px;height:4px;border-radius:2px}
.dr{display:flex;gap:2px;justify-content:center;padding:0 14px 10px;flex-wrap:wrap}
.d{width:5px;height:5px;border-radius:50%;background:var(--border);cursor:pointer}.d.a-ko{background:var(--ko)}.d.sn{background:rgba(80,200,120,.5)}
.ki{margin:0 12px 12px;border-radius:14px;background:#1a1a35;border:1.5px solid rgba(255,215,0,.12);overflow:hidden;animation:fu .3s ease}
.ki-h{padding:10px 14px 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.ki-ms{font-size:1.6rem}.ki-tt{font-size:.78rem;font-weight:900;color:var(--gold)}
.ki-mt{text-align:center;padding:0 14px 6px;font-size:1.05rem;font-weight:900;line-height:1.3;color:#7eeae0}
.ki-b{margin:0 10px 5px;padding:8px 12px;border-radius:9px;font-size:.85rem;line-height:1.7;font-weight:700}
.ki-cn{background:rgba(255,169,77,.07);border:1px solid rgba(255,169,77,.12);color:#ffcc88}
.ki-ko{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.12);color:#a8ece8}
.ki-fl{font-size:.58rem;display:block;margin-bottom:2px;opacity:.5}
.ki-tp{margin:3px 10px 10px;padding:6px 12px;border-radius:9px;background:linear-gradient(135deg,rgba(255,215,0,.07),rgba(255,169,77,.04));border:1px solid rgba(255,215,0,.12);text-align:center;font-size:.85rem;font-weight:900;color:var(--gold)}
.phonics-pop{position:absolute;z-index:50;background:#1a1a35;border:1.5px solid rgba(78,205,196,.4);border-radius:12px;padding:8px 12px;font-size:.72rem;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;animation:fu .2s ease}
.phonics-pop .pp-char{font-size:1.2rem;font-weight:900;color:var(--ko);text-align:center;margin-bottom:4px}

.phonics-pop .pp-hangul{color:var(--ko);font-weight:700}

.gear-icon{padding:3px 8px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--dim);font-size:.68rem;cursor:pointer;font-family:inherit;white-space:nowrap}

.set-box .set-btns{display:flex;gap:8px;justify-content:center}

.s40-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:99998;display:none;align-items:center;justify-content:center;padding:8px}
.s40-overlay.show{display:flex}
.s40-modal{background:var(--card);border-radius:16px;padding:12px 14px;max-width:480px;width:100%;max-height:90vh;overflow:auto;border:1px solid rgba(255,215,0,.2);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.s40-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.s40-h span{font-size:.85rem;font-weight:900;color:#ffd700}.s40-h button{background:none;border:none;color:rgba(255,255,255,.5);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:6px}.s40-h button:hover{color:#fff;background:rgba(255,255,255,.1)}
.s40-tabs{display:flex;gap:4px;margin-bottom:10px}.s40-tab{flex:1;padding:6px 0;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:transparent;color:rgba(255,255,255,.4);font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit}.s40-tab.a{background:rgba(255,215,0,.15);color:#ffd700;border-color:rgba(255,215,0,.3)}
.fam{margin-bottom:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.fam-t{font-size:.72rem;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.fam-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.sc{width:52px;padding:6px 2px;border-radius:8px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);text-align:center;cursor:pointer;transition:all .15s}
.sc:hover{transform:translateY(-2px);border-color:rgba(78,205,196,.4);background:rgba(78,205,196,.06)}
.sc:active{transform:scale(.95)}
.sc-h{font-size:1.2rem;font-weight:900;color:#a8ece8;line-height:1.2}
.sc-z{font-size:.55rem;color:#ffd700;font-weight:700}
.sc-n{font-size:.42rem;color:rgba(255,255,255,.3);line-height:1.1;margin-top:1px}
.sc.plain{border-color:rgba(78,205,196,.2)}.sc.asp{border-color:rgba(255,169,77,.3)}.sc.tens{border-color:rgba(255,107,107,.3)}
.sc.yang{border-color:rgba(255,215,0,.3)}.sc.yin{border-color:rgba(156,136,255,.3)}.sc.combo{border-color:rgba(168,236,224,.2)}
.sc-pop{position:fixed;z-index:99999;background:#1a1a35;border:1.5px solid rgba(255,215,0,.4);border-radius:14px;padding:12px 16px;min-width:240px;max-width:320px;box-shadow:0 12px 32px rgba(0,0,0,.6);animation:fu .2s ease}
.sc-pop .pop-big{font-size:2.5rem;font-weight:900;text-align:center;color:#a8ece8}
.sc-pop .pop-zh{font-size:1.2rem;font-weight:900;text-align:center;color:#ffd700;margin:2px 0}
.sc-pop .pop-name{font-size:.65rem;color:rgba(255,255,255,.4);text-align:center;margin-bottom:6px}
.sc-pop .pop-desc{font-size:.78rem;line-height:1.6;color:rgba(255,255,255,.75);padding:6px 0;border-top:1px solid rgba(255,255,255,.08)}
.sc-pop .pop-fam{display:flex;gap:6px;justify-content:center;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08)}
.sc-pop .pop-fam-item{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:700;text-align:center}
.sc-pop .pop-close{position:absolute;top:4px;right:8px;background:none;border:none;color:rgba(255,255,255,.3);font-size:.85rem;cursor:pointer}
.verb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:99998;display:none;align-items:center;justify-content:center;padding:16px}
.verb-overlay.show{display:flex}
.verb-modal{background:var(--card);border-radius:16px;padding:16px 18px;max-width:420px;width:100%;max-height:85vh;overflow:auto;border:1px solid rgba(255,215,0,.2);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.verb-modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.verb-modal-h span{font-size:.85rem;font-weight:900;color:#ffd700}.verb-modal-h button{background:none;border:none;color:rgba(255,255,255,.5);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:6px}.verb-modal-h button:hover{color:#fff;background:rgba(255,255,255,.1)}
.vtab-bar{display:flex;gap:4px;margin-bottom:10px}.vtab{flex:1;padding:6px 0;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:transparent;color:rgba(255,255,255,.4);font-size:.7rem;font-weight:700;cursor:pointer;font-family:inherit}.vtab.a{background:rgba(255,215,0,.15);color:#ffd700;border-color:rgba(255,215,0,.3)}
.diy-input{display:flex;gap:6px;margin-bottom:8px}
.diy-input input{flex:1;padding:8px 12px;border-radius:9px;border:1.5px solid rgba(78,205,196,.2);background:rgba(255,255,255,.05);color:#fff;font-size:.85rem;font-family:inherit}
.diy-input input::placeholder{color:rgba(255,255,255,.3)}
.diy-input input:focus{outline:none;border-color:rgba(78,205,196,.5)}
.diy-btn{padding:8px 16px;border-radius:9px;border:none;font-weight:900;font-size:.78rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.diy-btn.go{background:linear-gradient(135deg,#4ecdc4,#0047AB);color:#fff}
.diy-btn.go:disabled{opacity:.4;cursor:not-allowed}
.diy-loading{text-align:center;padding:12px;font-size:.75rem;color:rgba(78,205,196,.6)}
.diy-loading::after{content:'';display:inline-block;width:12px;height:12px;border:2px solid rgba(78,205,196,.3);border-top-color:#4ecdc4;border-radius:50%;animation:spin .6s linear infinite;margin-left:6px;vertical-align:middle}
.ld-c{display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:8px}.ld-t{color:var(--dim);font-size:.78rem}
.sp{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--ko);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐯 韓文句型積木</div>
<div class="sw"><button class="ub a" onclick="sU('tobi')">🐯 Tobi</button><button class="ub" onclick="sU('duri')">🐰 Duri</button><button class="ub" onclick="sU('gomi')">🐻 Gomi</button><button class="ub" onclick="sU('oliver')">🦊 Oliver</button></div>

<script>

// ─── Hangul decomposition tables ───
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHO_ZH={'ㄱ':'ㄍ/ㄎ','ㄲ':'ㄍㄍ','ㄴ':'ㄋ','ㄷ':'ㄉ/ㄊ','ㄸ':'ㄉㄉ','ㄹ':'ㄌ/ㄖ','ㅁ':'ㄇ','ㅂ':'ㄅ/ㄆ','ㅃ':'ㄅㄅ','ㅅ':'ㄙ','ㅆ':'ㄙㄙ','ㅇ':'(無)','ㅈ':'ㄐ/ㄓ','ㅉ':'ㄐㄐ','ㅊ':'ㄔ','ㅋ':'ㄎ','ㅌ':'ㄊ','ㅍ':'ㄆ','ㅎ':'ㄏ'};
const JUNG_ZH={'ㅏ':'ㄚ','ㅐ':'ㄟ','ㅑ':'ㄧㄚ','ㅒ':'ㄧㄟ','ㅓ':'ㄜ','ㅔ':'ㄟ','ㅕ':'ㄧㄜ','ㅖ':'ㄧㄟ','ㅗ':'ㄛ','ㅘ':'ㄨㄚ','ㅙ':'ㄨㄟ','ㅚ':'ㄨㄟ','ㅛ':'ㄧㄛ','ㅜ':'ㄨ','ㅝ':'ㄨㄜ','ㅞ':'ㄨㄟ','ㅟ':'ㄨㄧ','ㅠ':'ㄧㄨ','ㅡ':'ㄜ(扁)','ㅢ':'ㄜㄧ','ㅣ':'ㄧ'};
const JONG_ZH={'ㄱ':'ㄍ','ㄲ':'ㄍㄍ','ㄳ':'ㄍ+ㄙ','ㄴ':'ㄋ','ㄵ':'ㄋ+ㄐ','ㄶ':'ㄋ+ㄏ','ㄷ':'ㄉ','ㄹ':'ㄌ','ㄺ':'ㄌ+ㄍ','ㄻ':'ㄌ+ㄇ','ㄼ':'ㄌ+ㄅ','ㄽ':'ㄌ+ㄙ','ㄾ':'ㄌ+ㄊ','ㄿ':'ㄌ+ㄆ','ㅀ':'ㄌ+ㄏ','ㅁ':'ㄇ','ㅂ':'ㄅ','ㅄ':'ㄅ+ㄙ','ㅅ':'ㄙ','ㅆ':'ㄙㄙ','ㅇ':'ㄥ','ㅈ':'ㄐ','ㅊ':'ㄔ','ㅋ':'ㄎ','ㅌ':'ㄊ','ㅍ':'ㄆ','ㅎ':'ㄏ'};
const DOUBLE_BATCHIM={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};

function decomposeHangul(ch){const code=ch.charCodeAt(0);if(code<0xAC00||code>0xD7A3)return null;const base=code-0xAC00;return{cho:CHO[Math.floor(base/588)],jung:JUNG[Math.floor((base%588)/28)],jong:JONG[base%28]||null,hasBatchim:base%28>0};}
function hasBatchim(ch){const code=ch.charCodeAt(0);if(code<0xAC00||code>0xD7A3)return false;return(code-0xAC00)%28!==0;}
function getVowelHarmony(stem){const last=stem[stem.length-1];const code=last.charCodeAt(0);if(code<0xAC00||code>0xD7A3)return'neutral';const vi=Math.floor((code-0xAC00)%588/28);return(vi===0||vi===8)?'yang':'yin';}

function conjugateKo(verb){const v=verb.trim().replace(/다$/,'');if(!v)return null;const harmony=getVowelHarmony(v);const hb=hasBatchim(v[v.length-1]);const res={orig:v+'다',stem:v,forms:{}};if(v.endsWith('하')){const s=v.slice(0,-1);res.group='하다 動詞';res.forms={'해요體':s+'해요','합니다體':s+'합니다','過去':s+'했어요','否定':'안 '+s+'해요','想要':v+'고 싶어요','正在':v+'고 있어요','可以':v+'ㄹ 수 있어요','請求':s+'해 주세요','如果':v+'면','因為':s+'해서','雖然':v+'지만','打算':v+'ㄹ 거예요'};return res;}const aeo=harmony==='yang'?'아':'어';const past=harmony==='yang'?'았':'었';res.group=hb?'有收音動詞':'沒收音動詞';res.forms={'해요體':v+aeo+'요','합니다體':v+(hb?'습니다':'ㅂ니다'),'過去':v+past+'어요','否定':'안 '+v+aeo+'요','想要':v+'고 싶어요','正在':v+'고 있어요','可以':v+(hb?'을':'ㄹ')+' 수 있어요','請求':v+aeo+' 주세요','如果':v+(hb?'으면':'면'),'因為':v+aeo+'서','雖然':v+'지만','打算':v+(hb?'을':'ㄹ')+' 거예요'};return res;}

function show40Pop(el,type,idx){
  document.querySelectorAll('.sc-pop').forEach(p=>p.remove());
  const item=type==='c'?CONSONANTS[idx]:VOWELS[idx];
  // Speak the sound
  const sample=type==='c'?(item.h+'ㅏ'):('ㅇ'+item.h);
  sp(sample);
  
  const pop=document.createElement('div');pop.className='sc-pop';
  let h='<button class="pop-close" onclick="this.parentElement.remove()">✕</button>';
  h+='<div class="pop-big">'+item.h+'</div>';
  h+='<div class="pop-zh">'+item.z+'</div>';
  h+='<div class="pop-name">'+item.emoji+' '+item.name+'</div>';
  h+='<div class="pop-desc">'+item.desc.replace(/\n/g,'<br>')+'</div>';
  
  // Show family members for consonants
  if(type==='c'){
    const siblings=CONSONANTS.filter(c=>c.fam===item.fam&&c.h!==item.h);
    if(siblings.length>0){
      h+='<div class="pop-fam">';
      const colors={plain:'rgba(78,205,196,.15)',asp:'rgba(255,169,77,.15)',tens:'rgba(255,107,107,.15)',other:'rgba(168,236,224,.1)'};
      const labels={plain:'普通版',asp:'💨噴氣版',tens:'💪憋氣版',other:''};
      h+='<div class="pop-fam-item" style="background:'+({plain:'rgba(78,205,196,.15)',asp:'rgba(255,169,77,.15)',tens:'rgba(255,107,107,.15)',other:'rgba(168,236,224,.1)'}[item.type]||'rgba(168,236,224,.1)')+'"><div style="font-size:1.1rem">'+item.h+'</div><div style="font-size:.5rem;opacity:.6">👈 現在</div></div>';
      for(const s of siblings){
        h+='<div class="pop-fam-item" style="background:'+(colors[s.type]||colors.other)+';cursor:pointer;opacity:.7" onclick="show40Pop(this,\'c\','+CONSONANTS.indexOf(s)+')"><div style="font-size:1.1rem">'+s.h+'</div><div style="font-size:.5rem;opacity:.6">'+(labels[s.type]||s.name)+'</div></div>';
      }
      h+='</div>';
    }
  }
  
  // Speak button
  h+='<div style="text-align:center;margin-top:8px"><button style="padding:4px 16px;border-radius:8px;border:1px solid rgba(78,205,196,.3);background:rgba(78,205,196,.08);color:#a8ece8;font-size:.72rem;cursor:pointer;font-family:inherit" onclick="sp(\''+sample+'\')">🔊 再聽一次</button></div>';
  
  pop.innerHTML=h;
  document.body.appendChild(pop);
  // Position near center
  pop.style.left='50%';pop.style.top='50%';pop.style.transform='translate(-50%,-50%)';
  // Close on outside click after a delay
  setTimeout(()=>{
    const closer=function(e){if(!pop.contains(e.target)){pop.remove();document.removeEventListener('click',closer);}};
    document.addEventListener('click',closer);
  },100);
}

async function lD(){
  try{const r=await fetch('korean-rules.json');if(!r.ok)throw 0;const d=await r.json();
  R=d.map(r=>({id:r.id,dim:r.dimension_label,cn:r.chinese,
    ko:r.ko?{s:r.ko.sentence,b:r.ko.blocks,f:r.ko.formula||''}:null,
    ct:r.contrast||{}}));
  }catch{document.getElementById('app').innerHTML='<div class="ld-c"><div class="ld-t">請將 korean-rules.json 放在同目錄</div></div>';return;}
  F=R;document.getElementById('nc').value='1/'+R.length;rDT();uP();rn();
}

function rDT(){
  const ds={};R.forEach(r=>{ds[r.dim]=(ds[r.dim]||0)+1;});
  const s=Object.entries(ds).sort((a,b)=>b[1]-a[1]);
  let h='<button class="tab a" onclick="fD(\'all\')">全部 '+R.length+'</button>';
  for(const[d,c]of s)h+='<button class="tab" onclick="fD(\''+d.replace(/'/g,"\\'")+'\')">'+d+' '+c+'</button>';
  document.getElementById('dt').innerHTML=h;
}

function fD(d){
  F=R;
  if(d==='all'){ci=0;}else{const idx=R.findIndex(r=>r.dim===d);ci=idx>=0?idx:0;}
  document.querySelectorAll('.tab').forEach(t=>{const td=t.textContent.replace(/\s*\d+$/,'').trim();t.classList.toggle('a',d==='all'?td.startsWith('全部'):td===d);});
  rn();
}

function addFootIndicator(text){
  // Add 🦶/👟 indicators for zhuyin mode
  let r='';
  for(const ch of text){
    const code=ch.charCodeAt(0);
    if(code>=0xAC00&&code<=0xD7A3){
      const hb=(code-0xAC00)%28!==0;
      r+=ch+'<sup style="font-size:.4rem;opacity:.6">'+(hb?'🦶':'')+'</sup>';
    } else {
      r+=ch;
    }
  }
  return r;
}

function rn(){
  if(!F.length){document.getElementById('app').innerHTML='<div class="ld-c"><div class="ld-t">沒有符合的句子</div></div>';return;}
  const r=F[ci];mS(r.id);uP();
  const hk=!!KT[r.dim];
  
  // Build blocks
  let bh='';
  if(r.ko){
    bh='<div class="br">';
    r.ko.b.forEach(blk=>{
      const t=blk.text||'';const rl=blk.role||'';const gn=blk.grammar_note||'';const bs=blk.base||'';
      const tClean=t.replace(/\s+$/,'');
      const lastChar=tClean[tClean.length-1];
      const foot=(lastChar&&lastChar.charCodeAt(0)>=0xAC00&&lastChar.charCodeAt(0)<=0xD7A3)?((lastChar.charCodeAt(0)-0xAC00)%28!==0?'🦶':''):'';
      const isJc=rl==='助詞';
      const display=md==='zhuyin'?addFootIndicator(tClean):tClean;
      bh+='<div class="bk '+(isJc?'bk-jc':'bk-ko')+' r-'+rl+'" onclick="sp(\''+tClean.replace(/'/g,"\\'")+'\')'+(isJc?'':';showPhonics(this,\''+tClean.replace(/'/g,"\\'")+'\')')+'">'+display+'<span class="bk-r">'+rl+'</span>'+(gn?'<span class="bk-gn">'+eH(gn)+'</span>':'')+(bs&&bs!==tClean?'<span class="bk-base">'+eH(bs)+'</span>':'')+(foot?'<span class="bk-foot">'+foot+'</span>':'')+'</div>';
    })
    bh+='</div>';
    if(r.ko.f)bh+='<div class="formula-bar">'+eH(r.ko.f)+'</div>';
    bh+='<div style="text-align:center;padding:4px 0 6px"><button class="sf" onclick="sp(\''+r.ko.s.replace(/'/g,"\\'")+'\')">🔊 '+eH(r.ko.s)+'</button></div>';
  }
  
  // Contrast box
  let ct='';
  if(r.ct&&(r.ct.cn_blindspot||r.ct.ko_insight)){
    ct='<div class="cb">';
    if(r.ct.cn_blindspot)ct+='<div><span class="cl" style="color:var(--cn)">🇹🇼 中文陷阱：</span>'+eH(r.ct.cn_blindspot)+'</div>';
    if(r.ct.ko_insight)ct+='<div><span class="cl" style="color:var(--ko)">🇰🇷 韓文邏輯：</span>'+eH(r.ct.ko_insight)+'</div>';
    ct+='</div>';
  }
  
  // Dots
  const mx=Math.min(F.length,30);
  let dt='<div class="dr">';
  for(let i=0;i<mx;i++){
    const dc=i===ci?' a-ko':'';
    const sn=iS(F[i].id)?' sn':'';
    dt+='<div class="d'+dc+sn+'" onclick="gT('+i+')"></div>';
  }
  if(F.length>mx)dt+='<span style="color:var(--dim);font-size:.48rem;align-self:center">+'+(F.length-mx)+'</span>';
  dt+='</div>';
  
  // Legend
  const lg='<div class="lg"><div class="li"><div class="ld" style="background:#ff6b6b"></div>主角</div><div class="li"><div class="ld" style="background:#4ecdc4"></div>動作</div><div class="li"><div class="ld" style="background:#ffd93d"></div>對象</div><div class="li"><div class="ld" style="background:#a78bfa"></div>修飾</div><div class="li"><div class="ld" style="background:#66bb6a"></div>場景</div><div class="li"><div class="ld" style="background:#ff9800"></div>目標</div><div class="li"><div class="ld" style="background:#42a5f5"></div>時間</div><div class="li"><div class="ld" style="background:#ef5350"></div>語氣</div></div>';
  
  document.getElementById('app').innerHTML='<div class="mc m-'+md+'"><div class="ca"><div class="cs">'+eH(r.cn)+'</div><div class="cd">'+eH(r.dim)+'</div></div><div class="ba">'+bh+'</div>'+ct+lg+'</div>'+gKI(r)+dt;
  document.getElementById('nc').value=(ci+1)+'/'+F.length;
  var nb=document.querySelectorAll('.nb');if(nb[0])nb[0].disabled=ci===0;if(nb[1])nb[1].disabled=ci>=F.length-1;
  document.querySelectorAll('.tab').forEach(function(t){var td=t.textContent.replace(/\s*\d+$/,'').trim();t.classList.toggle('a',td===r.dim);});
}

function gKI(r){
  const d=KT[r.dim];
  if(!d)return '';
  return '<div class="ki"><div style="padding:10px 14px 6px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap"><span style="font-size:1.4rem">'+d.m+'</span><span style="font-size:.75rem;font-weight:900;color:#ffd700">'+d.m+' '+d.t+' 的韓文魔法教室</span><span style="font-size:1rem;font-weight:900;color:#7eeae0">'+d.mt+'</span></div><div class="ki-b ki-cn"><span class="ki-fl">🇹🇼 中文大腦怎麼想</span>'+nl2br(d.cn)+'</div><div class="ki-b ki-ko"><span class="ki-fl">🇰🇷 韓文大腦怎麼想</span>'+nl2br(d.br)+'</div><div class="ki-tp">'+nl2br(d.tp)+'</div></div>';
}

// ─── Event handlers ───
document.addEventListener('keydown',e=>{
  const t=e.target;if(t.tagName==='INPUT'||t.tagName==='TEXTAREA')return;
  if(e.key==='ArrowLeft')nv(-1);
  if(e.key==='ArrowRight')nv(1);
  if(e.key===' '||e.code==='Space'){e.preventDefault();const r=F[ci];if(r&&r.ko)sp(r.ko.s);return;}
  if(e.key==='1')sM('ko');
  if(e.key==='2')sM('zhuyin');
},true);

let wT=0;document.addEventListener('wheel',e=>{
  if(e.target.closest('.ki')||e.target.closest('.cb')||e.target.closest('.verb-modal'))return;
  const now=Date.now();if(now-wT<300)return;wT=now;
  if(e.deltaY<0)nv(1);else if(e.deltaY>0)nv(-1);
  e.preventDefault();
},{passive:false});

let tX=0;
document.addEventListener('touchstart',e=>{tX=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  if(e.target.closest('.tab')||e.target.closest('.ub')||e.target.closest('.lb')||e.target.closest('.nb')||e.target.closest('.hn')||e.target.closest('.ki')||e.target.closest('.verb-modal')||e.target.closest('button')||e.target.closest('input'))return;
  const d=e.changedTouches[0].clientX-tX;
  if(Math.abs(d)>60)nv(d>0?-1:1);
});

// ─── Init ───
lD();
updGear();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=1').catch(()=>{});}
</script>
